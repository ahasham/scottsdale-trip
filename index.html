    var html = await unlock(pw);
    if(remember){ try{ localStorage.setItem('pat-pw', pw); }catch(e){} }
    document.open(); document.write(html); document.close();
    return true;
  }catch(e){ return false; }
}
document.getElementById('f').addEventListener('submit', async function(e){
  e.preventDefault();
  var pw = document.getElementById('pw').value.trim();
  document.getElementById('err').textContent = 'Unlocking...';
  if(!(await go(pw, true)) && !(await go(pw.toUpperCase(), true))) document.getElementById('err').textContent = 'That password did not work.';
});
(async function(){ var s = null; try{ s = localStorage.getItem('pat-pw'); }catch(e){} if(s) await go(s, false); })();
</script></body></html>
