function b(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
async function unlock(pw){
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b(P.salt), iterations:P.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b(P.iv)}, key, b(P.ct));
  return new TextDecoder().decode(pt);
}
async function go(pw, remember){
  try{
    var html = await unlock(pw);
    if(remember){ try{ localStorage.setItem('pat-pw', pw); }catch(e){} }
    document.open(); document.write(html); document.close();
    return true;
  }catch(e){ return false; }
}
document.getElementById('f').addEventListener('submit', async function(e){
